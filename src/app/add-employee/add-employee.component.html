<div class="page" dir="rtl">
  <div class="form-card">
    <div class="form-header">
      <h2>הוספת עובד חדש</h2>
      <a routerLink="/employee" class="back-link">חזרה לרשימה</a>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="employee-form">
      <div class="form-grid">
        <div class="field">
          <label for="id">תעודת זהות</label>
          <input type="text" id="id" formControlName="id" placeholder="הכנס ת.ז (9 ספרות)" />
          <div class="error" *ngIf="form.get('id').invalid && form.get('id').touched">
            <span *ngIf="form.get('id').errors?.['required']">שדה חובה</span>
            <span *ngIf="form.get('id').errors?.['pattern']">ספרות בלבד</span>
            <span *ngIf="form.get('id').errors?.['minlength'] || form.get('id').errors?.['maxlength']">בדיוק 9 ספרות</span>
          </div>
        </div>

        <div class="field">
          <label for="first_name">שם פרטי</label>
          <input type="text" id="first_name" formControlName="first_name" placeholder="הכנס שם פרטי" />
          <div class="error" *ngIf="form.get('first_name').invalid && form.get('first_name').touched">
            <span *ngIf="form.get('first_name').errors?.['required']">שדה חובה</span>
          </div>
        </div>

        <div class="field">
          <label for="last_name">שם משפחה</label>
          <input type="text" id="last_name" formControlName="last_name" placeholder="הכנס שם משפחה" />
          <div class="error" *ngIf="form.get('last_name').invalid && form.get('last_name').touched">
            <span *ngIf="form.get('last_name').errors?.['required']">שדה חובה</span>
          </div>
        </div>

        <div class="field">
          <label for="date_of_birth">תאריך לידה</label>
          <input type="date" id="date_of_birth" formControlName="date_of_birth" />
          <div class="error" *ngIf="form.get('date_of_birth').invalid && form.get('date_of_birth').touched">
            <span *ngIf="form.get('date_of_birth').errors?.['required']">שדה חובה</span>
          </div>
        </div>

        <div class="field">
          <label for="beginning_work">תאריך תחילת עבודה</label>
          <input type="date" id="beginning_work" formControlName="beginning_work" />
          <div class="error" *ngIf="form.get('beginning_work').invalid && form.get('beginning_work').touched">
            <span *ngIf="form.get('beginning_work').errors?.['required']">שדה חובה</span>
          </div>
        </div>

        <div class="field">
          <label>מין</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" formControlName="gender" value="0" />
              <span>זכר</span>
            </label>
            <label class="radio-label">
              <input type="radio" formControlName="gender" value="1" />
              <span>נקבה</span>
            </label>
          </div>
          <div class="error" *ngIf="form.get('gender').invalid && form.get('gender').touched">
            <span *ngIf="form.get('gender').errors?.['required']">שדה חובה</span>
          </div>
        </div>
      </div>

      <div class="roles-section">
        <div class="roles-header">
          <h3>תפקידים</h3>
          <button type="button" class="btn btn-outline" (click)="addRole()">+ הוספת תפקיד</button>
        </div>

        <div *ngIf="isDuplicateRole()" class="error" style="margin-bottom: 12px;">
          לא ניתן להוסיף אותו תפקיד פעמיים
        </div>

        <div formArrayName="roles" class="roles-list">
          <div *ngFor="let roleCtrl of rolesArray.controls; let i = index" [formGroupName]="i" class="role-row">
            <div class="role-field">
              <label>תפקיד</label>
              <select formControlName="role_id">
                <option value="">בחר תפקיד</option>
                <option *ngFor="let r of rolesList" [value]="r.id">{{ r.title }}</option>
              </select>
            </div>
            <div class="role-field">
              <label>תאריך כניסה לתפקיד</label>
              <input type="date" formControlName="entry_date" [min]="form.get('beginning_work').value" />
            </div>
            <div class="role-field-checkbox">
              <label class="checkbox-label">
                <input type="checkbox" formControlName="is_managerial" />
                <span>ניהולי</span>
              </label>
            </div>
            <button type="button" class="remove-role" (click)="removeRole(i)" title="הסר תפקיד">x</button>
          </div>
        </div>

        <p *ngIf="rolesArray.controls.length === 0" class="no-roles">לא נוספו תפקידים</p>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="isSaving">
          {{ isSaving ? 'שומר...' : 'שמירה' }}
        </button>
        <button type="button" class="btn btn-ghost" (click)="cancel()">ביטול</button>
      </div>
    </form>
  </div>
</div>
